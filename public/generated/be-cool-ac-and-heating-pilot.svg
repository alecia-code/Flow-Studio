<text x="320" y="340" text-anchor="middle" fill="#153A5F" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">HVAC QUOTE-TO-BOOKING FLOW</text>
<rect x="64" y="368" width="512" height="114" rx="12" fill="#FFFFFF"/>
<g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#173D61" text-anchor="middle">
<rect x="76" y="397" width="106" height="44" rx="9" fill="#DDEEF9"/><text x="129" y="423">QUOTE FORM</text>
