<text x="596" y="50" text-anchor="end" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" font-weight="700">Jenna Alecia Studios</text>
<text x="44" y="116" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="33" font-weight="700">What if every request</text>
<text x="44" y="159" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="33" font-weight="700">had a clear next step?</text>
<text x="44" y="205" fill="#D5E9F7" font-family="Arial,sans-serif" font-size="17">A personalized idea for Be Cool A/C and Heating</text>
