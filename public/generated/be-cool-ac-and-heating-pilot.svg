</g>
<g stroke="#507A9B" stroke-width="2" fill="none"><path d="M186 419h17m-5 -5 5 5-5 5"/><path d="M317 419h17m-5 -5 5 5-5 5"/><path d="M448 419h17m-5 -5 5 5-5 5"/></g>
<text x="320" y="462" text-anchor="middle" fill="#55718A" font-family="Arial,sans-serif" font-size="11">Illustrative concept, not an assessment of existing software</text>
<text x="44" y="583" fill="#183E64" font-family="Arial,sans-serif" font-size="25" font-weight="700">A smoother experience for your customers.</text>
<text x="44" y="620" fill="#183E64" font-family="Arial,sans-serif" font-size="25" font-weight="700">A clearer workflow for your team.</text>
<text x="44" y="699" fill="#102B4E" font-family="Arial,sans-serif" font-size="18" font-weight="700">Hi Be Cool A/C and Heating team,</text>
<g fill="#263F58" font-family="Arial,sans-serif" font-size="16">
<text x="44" y="745">I noticed your online quote form asks customers to describe</text>
<text x="44" y="772">their problem and explains that your team will contact them</text>
<text x="44" y="799">to confirm and schedule. That handoff could be a useful</text>
<text x="44" y="826">place to make request status and follow-up visibility clear.</text>
<text x="44" y="875">This is an illustrative idea, not an assumption that your</text>
<text x="44" y="902">current process is missing any of these capabilities.</text>
<text x="44" y="970">I run Jenna Alecia Studios, where I build streamlined intake</text>
<text x="44" y="996">and follow-up systems for service businesses.</text>
</g>
<rect x="44" y="1040" width="264" height="182" rx="14" fill="#E9F3FA"/>
<rect x="332" y="1040" width="264" height="182" rx="14" fill="#E9F3FA"/>
<g font-family="Arial,sans-serif" fill="#153A5F" font-weight="700" font-size="19"><text x="64" y="1081">For your customers</text><text x="352" y="1081">For your team</text></g>
<g font-family="Arial,sans-serif" fill="#314D66" font-size="15">
<text x="64" y="1122">An easier way to request service,</text><text x="64" y="1146">share details, and understand</text><text x="64" y="1170">what happens next.</text>
<text x="352" y="1122">See incoming requests, pending</text><text x="352" y="1146">follow-ups, and confirmed</text><text x="352" y="1170">appointments in one place.</text>
</g>
<text x="44" y="1295" fill="#173C61" font-family="Arial,sans-serif" font-size="24" font-weight="700">Curious what it would take to build this?</text>
